[package]
name = "commiter"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A Rust TUI app that generates commit messages from git diffs using opencode CLI"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
